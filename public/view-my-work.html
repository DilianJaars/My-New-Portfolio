<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Browse Dilian Jaars' work: websites.">
    <title>View My Work | Dilian Jaars</title>

    <link rel="icon" href="images/dj-logo.jpg" type="image/jpeg">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --green: #00e881;
            --ink: #080b0d;
            --surface: #111619;
            --line: rgba(255, 255, 255, 0.11);
            --muted: #9aa7ad;
            --white: #f5faf7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: var(--ink);
            color: var(--white);
            font-family: "Trebuchet MS", "Gill Sans", sans-serif;
            overflow-x: hidden;
        }

        .page-shell {
            min-height: 100vh;
            position: relative;
            isolation: isolate;
        }

        .page-shell::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -2;
            background:
                radial-gradient(
                    circle at 78% 7%,
                    rgba(35, 200, 232, 0.14),
                    transparent 29rem
                ),
                linear-gradient(
                    145deg,
                    #080b0d 18%,
                    #10171a 58%,
                    #080b0d 100%
                );
        }

        .topbar {
            display: flex;
            align-items: center;
            max-width: 1240px;
            margin: 0 auto;
            padding: 28px 24px;
        }

        .round-button {
            align-items: center;
            background: rgba(17, 22, 25, 0.82);
            border: 1px solid var(--line);
            border-radius: 50%;
            color: var(--white);
            display: inline-flex;
            height: 48px;
            width: 48px;
            justify-content: center;
            text-decoration: none;
            transition: all .2s ease;
        }

        .round-button:hover {
            background: var(--green);
            border-color: var(--green);
            color: var(--ink);
            transform: translateY(-2px);
        }

        main {
            max-width: 1300px;
            margin: 0 auto;
            padding: 20px 24px 100px;
        }

        .eyebrow {
            color: var(--green);
            font-size: .78rem;
            font-weight: 800;
            letter-spacing: .22em;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        h1 {
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 400;
            letter-spacing: -.04em;
            line-height: 1;
            margin-bottom: 20px;
        }

        h1 span {
            color: var(--green);
            font-style: italic;
        }

        .intro {
            color: var(--muted);
            font-size: 1.08rem;
            line-height: 1.7;
            max-width: 60ch;
            margin-bottom: 60px;
        }

        .category-grid {
            display: grid;
            gap: 24px;
            grid-template-columns: 1fr;
            max-width: 800px;
        }

        .category-card {
            background: linear-gradient(
                150deg,
                rgba(23, 30, 34, .98),
                rgba(13, 18, 20, .98)
            );
            border: 1px solid var(--line);
            border-radius: 4px 28px 4px 4px;
            color: var(--white);
            display: block;
            min-height: 300px;
            overflow: hidden;
            padding: clamp(28px, 4vw, 40px);
            position: relative;
            text-decoration: none;
            transition: border-color .25s ease, transform .25s ease;
        }

        .category-card:hover {
            border-color: rgba(0, 232, 129, .62);
            transform: translateY(-6px);
        }

        .category-card i {
            color: var(--green);
            font-size: 2.2rem;
            margin-bottom: 30px;
            display: block;
        }

        .category-card h2 {
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(1.8rem, 3vw, 2.4rem);
            font-weight: 400;
            margin-bottom: 12px;
        }

        .category-card p {
            color: var(--muted);
            line-height: 1.6;
        }

        .category-card .arrow {
            position: absolute;
            right: 28px;
            bottom: 28px;
            color: var(--green);
            font-size: 1.2rem;
            transition: transform .25s ease;
        }

        .category-card:hover .arrow {
            transform: translate(4px, -4px);
        }

        @media (max-width: 820px) {
            .category-grid {
                grid-template-columns: 1fr;
                max-width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="page-shell">

        <header class="topbar">
            <a
                href="index.html"
                class="round-button"
                aria-label="Back to home"
                title="Back to home"
            >
                <i class="fa-solid fa-arrow-left"></i>
            </a>
        </header>

        <main>
            <p class="eyebrow">Portfolio</p>

            <h1>
                View my <span>work.</span>
            </h1>

            <p class="intro">
                A collection of the websites and web apps I've designed and built.
                Pick one to explore.
            </p>

            <div class="category-grid">

                <a
                    href="websites.html"
                    class="category-card"
                >
                    <i class="fa-solid fa-globe"></i>

                    <h2>Websites</h2>

                    <p>
                        Live sites and web apps I've designed and built
                        end to end.
                    </p>

                    <i class="fa-solid fa-arrow-up-right-from-square arrow"></i>
                </a>

            </div>
        </main>

    </div>
</body>
</html>
