<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get In Touch - Dilian Jaars</title>
    <link rel="icon" href="images/dj-logo.jpg" type="image/jpeg">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #00ff88;
            --secondary-color: #00d4ff;
            --accent-color: #ff0080;
            --dark-bg: #0a0a0a;
            --card-bg: #1a1a1a;
            --text-light: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--dark-bg);
            color: var(--text-light);
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Animated Background */
        .animated-bg {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
            background: var(--dark-bg);
        }

        .animated-bg::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, var(--primary-color) 0%, transparent 70%);
            border-radius: 50%;
            top: -100px;
            right: -100px;
            opacity: 0.15;
            animation: float 12s ease-in-out infinite;
        }

        .animated-bg::after {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--accent-color) 0%, transparent 70%);
            border-radius: 50%;
            bottom: -100px;
            left: -100px;
            opacity: 0.15;
            animation: float 10s ease-in-out infinite reverse;
        }

        .floating-shape {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, var(--secondary-color) 0%, transparent 70%);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.1;
            animation: pulse 8s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(80px, 80px) scale(1.2); }
        }

        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.1; }
            50% { transform: translate(-50%, -50%) scale(1.5); opacity: 0.05; }
        }

        /* Contact Container */
        .contact-container {
            max-width: 1200px;
            width: 100%;
            padding: 40px 20px;
            animation: fadeInUp 1s ease;
        }

        .contact-header {
            text-align: center;
            margin-bottom: 60px;
        }

        .contact-title {
            font-size: 4rem;
            font-weight: 900;
            margin-bottom: 1rem;
            background: linear-gradient(90deg, var(--primary-color) 0%, var(--secondary-color) 50%, var(--accent-color) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: fadeInUp 1s ease;
        }

        .contact-subtitle {
            font-size: 1.5rem;
            color: #aaa;
            margin-bottom: 2rem;
            animation: fadeInUp 1s ease 0.2s backwards;
        }

        .neon-line {
            width: 150px;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
            margin: 2rem auto;
            box-shadow: 0 0 20px var(--primary-color);
            animation: fadeInUp 1s ease 0.4s backwards;
        }

        /* Contact Cards */
        .contact-methods {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            margin-bottom: 60px;
        }

        .contact-methods .contact-card {
            width: 300px;
            flex: 0 1 300px;
        }

        .contact-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            border: 2px solid transparent;
            transition: all 0.4s ease;
            text-align: center;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .contact-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--accent-color) 100%);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .contact-card:hover::before {
            opacity: 0.1;
        }

        .contact-card:hover {
            transform: translateY(-15px);
            border-color: var(--primary-color);
            box-shadow: 0 20px 60px rgba(0, 255, 136, 0.5);
        }

        .contact-icon {
            font-size: 4rem;
            margin-bottom: 25px;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
            z-index: 1;
            transition: all 0.4s ease;
        }

        .contact-card:hover .contact-icon {
            transform: scale(1.2);
        }

        .contact-method-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: var(--text-light);
            position: relative;
            z-index: 1;
        }

        .contact-method-text {
            color: #aaa;
            font-size: 1rem;
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }

        .contact-method-value {
            color: var(--primary-color);
            font-size: 1.1rem;
            font-weight: 600;
            position: relative;
            z-index: 1;
        }

        
        .gmail-form {
            background: var(--card-bg);
            padding: 50px;
            border-radius: 20px;
            border: 2px solid rgba(0, 255, 136, 0.3);
            max-width: 700px;
            margin: 0 auto;
            animation: fadeInUp 1s ease 0.6s backwards;
        }

        .gmail-form h3 {
            color: var(--primary-color);
            font-size: 2.5rem;
            margin-bottom: 15px;
            text-align: center;
            font-weight: 900;
        }

        .gmail-form p {
            text-align: center;
            color: #aaa;
            margin-bottom: 40px;
            font-size: 1.1rem;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            color: var(--primary-color);
            font-weight: 700;
            margin-bottom: 10px;
            font-size: 1rem;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(0, 255, 136, 0.3);
            border-radius: 10px;
            color: var(--text-light);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 150px;
        }

        .gmail-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            border: none;
            border-radius: 10px;
            color: var(--dark-bg);
            font-size: 1.2rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .gmail-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 40px rgba(0, 255, 136, 0.6);
        }

        .gmail-btn i {
            font-size: 1.5rem;
        }

       

        /* Back Button */
        .back-btn {
            position: fixed;
            top: 30px;
            left: 30px;
            width: 50px;
            height: 50px;
            background: var(--card-bg);
            border: 2px solid var(--primary-color);
            border-radius: 50%;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 999;
            text-decoration: none;
        }

        .back-btn:hover {
            background: var(--primary-color);
            color: var(--dark-bg);
            transform: scale(1.1);
            box-shadow: 0 0 30px var(--primary-color);
        }

        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        
        @media (max-width: 768px) {
            .contact-title {
                font-size: 2.5rem;
            }

            .contact-subtitle {
                font-size: 1.2rem;
            }

            .gmail-form {
                padding: 30px 20px;
            }

            .contact-methods {
                flex-direction: column;
                align-items: center;
            }

            .contact-methods .contact-card {
                width: 100%;
                max-width: 400px;
            }

            .back-btn {
                top: 20px;
                left: 20px;
                width: 45px;
                height: 45px;
            }
        }
         #scrollTopBtn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 50px;
      height: 50px;
      background: #333;
      color: white;
      border: none;
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    #scrollTopBtn.show {
      opacity: 1;
      visibility: visible;
    }

    #scrollTopBtn:hover {
      background: #555;
    }

    #scrollTopBtn svg {
      width: 24px;
      height: 24px;
      fill: white;
    }

    @media (max-width: 768px) {
      #scrollTopBtn {
        width: 45px;
        height: 45px;
      }
    }
    </style>
</head>
<body>
    <div class="animated-bg">
        <div class="floating-shape"></div>
    </div>

    
    <a href="index.html" class="back-btn" title="Go Back">
        <i class="fas fa-arrow-left"></i>
    </a>

    <div class="contact-container">
        
        <div class="contact-header">
            <h1 class="contact-title">Get In Touch</h1>
            <div class="neon-line"></div>
            <p class="contact-subtitle">Let's create something amazing together!</p>
        </div>

        
        <div class="contact-methods">
            <div class="contact-card" onclick="window.open('mailto:dilian.jaars@gmail.com', '_blank')">
                <div class="contact-icon">
                    <i class="fas fa-envelope"></i>
                </div>
                <h3 class="contact-method-title">Email</h3>
                <p class="contact-method-text">Send me a message anytime</p>
                <p class="contact-method-value">dilian.jaars@gmail.com</p>
            </div>

            <div class="contact-card" onclick="window.open('https://github.com/DilianJaars', '_blank')">
                <div class="contact-icon">
                    <i class="fab fa-github"></i>
                </div>
                <h3 class="contact-method-title">GitHub</h3>
                <p class="contact-method-text">View my projects and code</p>
                <p class="contact-method-value">DilianJaars</p>
            </div>

            <div class="contact-card" onclick="window.open('https://www.linkedin.com/in/dilian-jaars-337781320/', '_blank')">
                <div class="contact-icon">
                    <i class="fab fa-linkedin"></i>
                </div>
                <h3 class="contact-method-title">LinkedIn</h3>
                <p class="contact-method-text">Connect with me professionally</p>
                <p class="contact-method-value">Dilian Jaars</p>
            </div>
        </div>

        
        <div class="gmail-form">
            <h3>Send Email </h3>
            <p>Fill out the form below </p>
            <form id="gmailForm" onsubmit="sendGmail(event)">
                <div class="form-group">
                    <label for="senderName">Your Name *</label>
                    <input type="text" id="senderName" required placeholder="Enter your name">
                </div>

                <div class="form-group">
                    <label for="senderEmail">Your Email *</label>
                    <input type="email" id="senderEmail" required placeholder="your.email@example.com">
                </div>

                <div class="form-group">
                    <label for="subject">Subject *</label>
                    <input type="text" id="subject" required placeholder="What's this about?">
                </div>

                <div class="form-group">
                    <label for="message">Message *</label>
                    <textarea id="message" required placeholder="Write your message here..."></textarea>
                </div>

                <button type="submit" class="gmail-btn">
                    <i class="fab fa-google"></i>
                    Open in Gmail
                </button>
            </form>
        </div>

        <button id="scrollTopBtn" aria-label="Scroll to top">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 4l-8 8h5v8h6v-8h5l-8-8z"/>
    </svg>
  </button>
        

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
    <script>
        function sendGmail(event) {
            event.preventDefault();

          
            const name = document.getElementById('senderName').value;
            const email = document.getElementById('senderEmail').value;
            const subject = document.getElementById('subject').value;
            const message = document.getElementById('message').value;

            
            const emailBody = `
Name: ${name}
Email: ${email}

Message:
${message}
            `.trim();

            // Your Gmail address
            const recipientEmail = 'dilian.jaars@gmail.com';

            
            const encodedSubject = encodeURIComponent(subject);
            const encodedBody = encodeURIComponent(emailBody);

            
            const gmailUrl = `https://mail.google.com/mail/?view=cm&fs=1&to=${recipientEmail}&su=${encodedSubject}&body=${encodedBody}`;

            
            window.open(gmailUrl, '_blank');

            
            setTimeout(() => {
                document.getElementById('gmailForm').reset();
            }, 500);
        }

        
        document.querySelectorAll('.contact-card').forEach(card => {
            card.addEventListener('click', function() {
                this.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    this.style.transform = '';
                }, 200);
            });
        });
        const btn = document.getElementById('scrollTopBtn');

    window.addEventListener('scroll', () => {
      if (window.pageYOffset > 300) {
        btn.classList.add('show');
      } else {
        btn.classList.remove('show');
      }
    });

    btn.addEventListener('click', () => {
      window.scrollTo({
        top: 0,
        behavior: 'smooth'
      });
    });
    </script>
</body>
</html>
